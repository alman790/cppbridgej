name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-jdk:
    name: JDK 26 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Verify
        run: ./mvnw -B -Dcppbridge.requireNativeCompiler=true clean verify

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Verify
        run: ./mvnw -B -Pcoverage clean verify

      - name: Test platform distribution
        run: python3 scripts/package-release.py platform

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            **/target/site/jacoco
            **/target/surefire-reports
          if-no-files-found: ignore

  windows-smoke:
    name: Windows native
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Activate MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify native toolchain
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction Stop
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop

          Write-Host "cl: $($cl.Source)"
          Write-Host "dumpbin: $($dumpbin.Source)"

          where.exe cl
          if ($LASTEXITCODE -ne 0) {
            throw "cl.exe is not available on PATH"
          }

          where.exe dumpbin
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin.exe is not available on PATH"
          }

      - name: Verify full Windows reactor
        run: .\mvnw.cmd -B "-Dcppbridge.requireNativeCompiler=true" clean verify

      - name: Test platform distribution
        run: python scripts/package-release.py platform

      - name: Show native build reports
        shell: bash
        run: ./scripts/show-build-reports.sh
